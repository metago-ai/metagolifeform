<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自见协议 · 自检页（故意埋了 8 类问题）</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; color: #1a1a1a; background: #fff; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .row { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }

  /* 故意问题 1：固定宽度 + overflow hidden → 文字被横向裁切 */
  .btn-clip { width: 96px; height: 32px; overflow: hidden; white-space: nowrap;
              border: 1px solid #1f6feb; border-radius: 6px; background: #eef4ff; color: #1f6feb;
              font-size: 14px; line-height: 32px; padding-left: 8px; }

  /* 故意问题 2：极低对比度文字 */
  .low-contrast { color: #ededed; background: #ffffff; font-size: 14px; }

  /* 故意问题 3：纵向裁切（高度不够 + overflow hidden + 长文本） */
  .v-clip { width: 220px; height: 30px; overflow: hidden; font-size: 13px; line-height: 20px;
            border: 1px solid #d0d7de; padding: 4px; }

  /* 故意问题 4：可点击元素过小 */
  .tiny { width: 12px; height: 12px; background: #1f6feb; border: 0; display: inline-block; }

  /* 故意问题 5：固定 1200px 宽，窄视口必然横向溢出（不能放在 flex 里，否则会被压缩） */
  .wide { width: 1200px; height: 40px; background: #f6f8fa; border: 1px solid #d0d7de; flex-shrink: 0; }

  .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; width: 320px; }
  .muted { color: #57606a; font-size: 13px; }
</style>
</head>
<body>
  <h1>自见协议 · 自检页</h1>
  <p class="muted">这一页故意埋了 8 类问题，用来验证 audit-web.mjs 能不能抓出来。配套断言脚本：scripts/selftest.mjs。</p>

  <div class="row">
    <div class="btn-clip">立即开始一次完整的网站自查</div>
    <span class="low-contrast">这段文字几乎看不见（浅灰压白底）</span>
    <button class="tiny" aria-label="小按钮"></button>
  </div>

  <div class="row">
    <img src="file:///D:/DSH-Official/home/skills/metago-self-eyes/scripts/does-not-exist.png" alt="故意坏图" width="80" height="60">
    <span class="muted">上面的图片路径不存在（破图检测；用绝对 file:// 路径，避免同目录出现同名文件导致静默失效）</span>
  </div>

  <div class="row">
    <div class="v-clip">这一段文字远超容器高度，会被纵向裁掉一大半，用来触发 text-vert-clipped 检查。</div>
  </div>

  <div class="wide"></div>

  <div class="row">
    <div class="card">
      <strong>卡片标题</strong>
      <p class="muted">TODO: 这里还没写完（占位内容检测）</p>
      <p>正文示例：这一段是正常内容，用来保证页面不是空白页。</p>
    </div>
  </div>
</body>
</html>
